# Alert on any augur-daily.service failure. Without this the only alive-signal
# is "someone notices missing `Daily update` commits on origin/main" — which is
# why the 2026-06-29 -> 07-03 outage ran five nights in silence. Every in-script
# ALARM (ARF FAIL, DEP_MARKER, SMOKE_MARKER, eval-stale, t0-stale/jumped)
# surfaces in the *commit subject*, so a unit that dies before committing emits
# nothing at all; this covers exactly that gap.
#
# A separate drop-in (not an edit to augur-daily.service) so it can be added or
# removed without touching the ExecStartPre gate ordering declared there —
# same convention as nexusmind.service.d/alert.conf on this host.
#
# Install: cp to /etc/systemd/system/augur-daily.service.d/ && systemctl daemon-reload
[Unit]
OnFailure=augur-alert@%n.service
