name: Test and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Test Python utilities
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography

    - name: Test Python module imports
      run: |
        python -c "from utils.secure_data_handler import SecureDataHandler; print('✓ SecureDataHandler import OK')"
        python -c "from utils.helpers import load_config; print('✓ helpers import OK')"
        python -c "from utils.data_types import EnhancedDataSet, CombinedDataSet; print('✓ data_types import OK')"
        python -c "from utils.timezone_helpers import get_timezone; print('✓ timezone_helpers import OK')"
        python -c "from decrypt_data_cached import fetch_with_retry, validate_base64_key; print('✓ decrypt_data_cached import OK')"

    - name: Test Python syntax
      run: |
        python -m py_compile decrypt_data_cached.py
        python -m py_compile utils/*.py

    - name: Test validation function
      run: |
        python -c "
        from decrypt_data_cached import validate_base64_key
        import base64

        # Test valid key
        valid_key = base64.b64encode(b'a' * 32).decode()
        result = validate_base64_key(valid_key, 'TEST_KEY')
        assert len(result) == 32, 'Valid key should return 32 bytes'

        # Test invalid base64
        try:
            validate_base64_key('not-valid!!!', 'TEST')
            assert False, 'Should reject invalid base64'
        except ValueError:
            pass

        # Test wrong length
        try:
            wrong_len = base64.b64encode(b'a' * 16).decode()
            validate_base64_key(wrong_len, 'TEST')
            assert False, 'Should reject wrong length'
        except ValueError:
            pass

        print('✓ All validation tests passed')
        "

    - name: Test retry logic
      run: |
        python - <<'PY'
        import threading
        import urllib.error
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from decrypt_data_cached import fetch_with_retry

        BODY = "plain utf-8 body ✓\n"

        class RetryHandler(BaseHTTPRequestHandler):
            flaky_hits = 0

            def do_GET(self):
                if self.path == "/flaky":
                    RetryHandler.flaky_hits += 1
                    if RetryHandler.flaky_hits == 1:
                        self.send_response(500)
                        self.end_headers()
                        return
                elif self.path == "/missing":
                    self.send_response(404)
                    self.end_headers()
                    return

                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.send_header("Content-Length", str(len(BODY.encode("utf-8"))))
                self.end_headers()
                self.wfile.write(BODY.encode("utf-8"))

            def log_message(self, *args):
                pass

        server = ThreadingHTTPServer(("127.0.0.1", 0), RetryHandler)
        thread = threading.Thread(target=server.serve_forever, daemon=True)
        thread.start()
        base = f"http://127.0.0.1:{server.server_address[1]}"

        try:
            # Successful fetch
            data = fetch_with_retry(f"{base}/ok")
            assert data == BODY, "successful fetch should return the body"

            # Transient 500 is retried and recovers
            data = fetch_with_retry(f"{base}/flaky", max_retries=2, initial_delay=0)
            assert data == BODY, "retry should recover from a transient 500"

            # Non-retryable client error raises immediately
            try:
                fetch_with_retry(f"{base}/missing", max_retries=2, initial_delay=0)
                raise AssertionError("404 should raise, not retry")
            except urllib.error.HTTPError:
                pass
        finally:
            server.shutdown()
            thread.join()

        print("✓ Retry logic test passed (success, transient-500 retry, 404 no-retry)")
        PY

  build-hugo:
    name: Build Hugo site
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.124.0'
        extended: false

    - name: Build Hugo site
      run: hugo --minify

    - name: Check build output
      run: |
        test -d public || (echo "public directory not created" && exit 1)
        test -f public/index.html || (echo "index.html not generated" && exit 1)
        test -f public/js/dashboard.js || (echo "dashboard.js not copied" && exit 1)
        test -f public/css/style.css || (echo "style.css not copied" && exit 1)
        echo "✓ Hugo build successful - all expected files present"

    - name: Verify JavaScript syntax
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - run: |
        npx eslint public/js/dashboard.js --no-eslintrc --parser-options=ecmaVersion:2022,sourceType:module || echo "⚠ ESLint warnings (non-blocking)"

  all-tests-passed:
    name: All Tests Passed
    needs: [test-python, build-hugo]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✓ All tests passed successfully!"
