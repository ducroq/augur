# Pinned, reproducible runtime environment for the Augur ML pipeline.
# AUTHORITATIVE for installs — scripts/bootstrap_venv.sh installs from this,
# NOT from the loose ranges in requirements.txt. Regenerate after an
# intentional dependency change:  pip freeze --exclude-editable > requirements.lock
#
# History: pandas was 3.0.4 here after the 2026-07-03 migration — a YANKED
# release (reported datetime segfaults). Repinned to the mature 2.x line
# (2.3.3) on 2026-07-03; all 195 tests pass on py3.12. river is held at
# 0.25.0 because ml/models/river_model.pkl is pickled under it — bumping
# river requires a warmup regen (see memory/gotcha-log.md 2026-07-03).
#
# EXP-021a Stage 3 (2026-11-07) added the Chronos-Bolt shadow: chronos-forecasting,
# torch and their dependency closure, with no existing pin changed. torch comes
# from the CPU index, because the PyPI wheel drags in the CUDA stack. A plain
# freeze from a --dev venv also picks up pytest and its deps: leave those out.
# A regenerated lock must keep the --extra-index-url line below. These pins are
# lock-only on purpose: Netlify may install the root requirements.txt (augur#35),
# and the dashboard build must not depend on torch.
--extra-index-url https://download.pytorch.org/whl/cpu
